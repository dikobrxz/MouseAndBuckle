<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Мышка и пряжка</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<style>

html, body{
    margin:0;
    padding:0;
    overflow:hidden;
    background:#ffffff;
    width:100%;
    height:100%;
}

#unity-container{
    width:100%;
    height:100%;
    position:relative;
}

#unity-canvas{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    background:#000;
}

#unity-loading-bar{

    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:280px;

    font-family:Arial,sans-serif;
    text-align:center;

    transition:opacity .4s;
}

#loading-bar-frame{

    width:100%;
    height:18px;

    border:1px solid #777;
    background:#ddd;

    border-radius:5px;
    overflow:hidden;
}

#loading-bar-fill{

    width:0%;
    height:100%;

    background:#53b34d;

    transition:width .15s linear;
}

#loading-progress{

    margin-top:10px;
    font-size:18px;
    color:#333;
}

#loading-status{

    display:none;
    margin-top:10px;

    font-size:18px;
    color:#333;
}

</style>

</head>

<body>

<div id="unity-container">

    <canvas id="unity-canvas"></canvas>

    <div id="unity-loading-bar">

        <div id="loading-bar-frame">
            <div id="loading-bar-fill"></div>
        </div>

        <div id="loading-progress">
            0%
        </div>
    </div>

</div>

<!-- ВАЖНО: прямое подключение loader.js -->
<script src="Build/MouseAndBuckle.loader.js"></script>
<script src="main.js"></script>

</body>
</html>
